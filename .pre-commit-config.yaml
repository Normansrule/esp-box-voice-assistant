# Optional: for people who already use https://pre-commit.com
#     pip install pre-commit && pre-commit install
# Without it, `git config core.hooksPath .githooks` runs the same check.
repos:
  - repo: local
    hooks:
      - id: check-secrets
        name: Block API keys, Wi-Fi passwords and private files
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: true
        always_run: false
