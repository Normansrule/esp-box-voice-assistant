name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware build (ESP-IDF v5.5.5, esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py size
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-esp32s3
          path: |
            build/esp_box_desk_buddy.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/storage.bin
            build/srmodels/srmodels.bin
            build/flash_args

  host-tests:
    name: Host tests and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/run_tests.py
      # The home brain server: wire format and tools, with stand-in models.
      - run: python tools/home_brain/test_home_brain.py
      - run: python tools/home_brain/test_brain_tools.py

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The scanner's own tests first, so a broken pattern cannot pass silently.
      - run: python tests/test_check_secrets.py
      # Keys, tokens, Wi-Fi passwords, sdkconfig, .env and private-key files.
      - run: python scripts/check_secrets.py

  generated:
    name: Simulator data and README art are fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/extract_firmware_data.py --check
      - run: |
          python tools/render_readme_art.py
          git diff --exit-code -- docs/assets web/connect/device.svg
