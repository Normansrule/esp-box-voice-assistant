name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware build (ESP-IDF v5.5.5, esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py size
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            build/esp_box_desk_buddy.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/storage.bin
            build/srmodels/srmodels.bin
            build/flash_args

  host-tests:
    name: Host tests and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/run_tests.py

  generated:
    name: Simulator data and README art are fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/extract_firmware_data.py --check
      - run: |
          python tools/render_readme_art.py
          git diff --exit-code -- docs/assets
      - name: No secrets committed
        run: |
          test ! -e spiffs/openai_key.txt
          ! git grep -nE 'sk-(proj-)?[A-Za-z0-9_-]{20,}' -- ':!*.lock'
