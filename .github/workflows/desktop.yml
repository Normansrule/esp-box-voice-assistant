name: Desktop app

# Builds the Windows app on every change to it or to the page it wraps, so a
# test build is always one click away under the run's Artifacts. Releases are
# built by release.yml instead, with the firmware bundled in.

on:
  push:
    branches: [main]
    paths: ["desktop/**", "web/connect/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "web/connect/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desk-buddy-connect-windows
          path: desktop/dist/*.exe
